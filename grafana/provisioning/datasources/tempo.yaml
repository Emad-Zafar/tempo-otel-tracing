apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    isDefault: true
    jsonData:
      # Draw the node graph for a single trace from its spans.
      nodeGraph:
        enabled: true
      # Trace to logs and the aggregated service map need a Loki and a
      # Prometheus data source. They are wired in the full observability stack.
