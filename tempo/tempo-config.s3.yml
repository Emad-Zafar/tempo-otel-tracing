server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_S3_BUCKET_NAME}
      endpoint: s3.${TEMPO_S3_REGION}.amazonaws.com
      region: ${TEMPO_S3_REGION}
    wal:
      path: /var/tempo/wal
